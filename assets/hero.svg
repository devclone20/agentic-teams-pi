<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7edb"/>
      <stop offset="0.55" stop-color="#fede5d"/>
      <stop offset="1" stop-color="#36f9f6"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7edb" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#36f9f6" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="240" rx="14" fill="#16121f"/>
  <rect x="1.5" y="1.5" width="1197" height="237" rx="13" fill="none" stroke="#2a2139" stroke-width="3"/>
  <rect x="0" y="232" width="1200" height="4" fill="url(#edge)" opacity="0.85"/>

  <!-- terminal chrome -->
  <circle cx="30" cy="28" r="7" fill="#f97e72"/>
  <circle cx="54" cy="28" r="7" fill="#fede5d"/>
  <circle cx="78" cy="28" r="7" fill="#72f1b8"/>
  <text x="600" y="33" text-anchor="middle" font-size="14" fill="#8a7fa8">π — your pi session, upgraded</text>

  <!-- title -->
  <text x="600" y="112" text-anchor="middle" font-size="52" font-weight="bold" fill="url(#title)">agentic-teams-pi</text>
  <text x="600" y="148" text-anchor="middle" font-size="18" fill="#c8bfe0">every Pi extension as an in-session slash command — one command on, same command off</text>

  <!-- command chips -->
  <g font-size="15" font-weight="bold">
    <rect x="273" y="176" width="92" height="34" rx="17" fill="none" stroke="#ff7edb" stroke-width="2"/>
    <text x="319" y="198" text-anchor="middle" fill="#ff7edb">/teams</text>

    <rect x="381" y="176" width="110" height="34" rx="17" fill="none" stroke="#36f9f6" stroke-width="2"/>
    <text x="436" y="198" text-anchor="middle" fill="#36f9f6">/pi-team</text>

    <rect x="507" y="176" width="130" height="34" rx="17" fill="none" stroke="#72f1b8" stroke-width="2"/>
    <text x="572" y="198" text-anchor="middle" fill="#72f1b8">/pi-experts</text>

    <rect x="653" y="176" width="110" height="34" rx="17" fill="none" stroke="#fede5d" stroke-width="2"/>
    <text x="708" y="198" text-anchor="middle" fill="#fede5d">/pi-coms</text>

    <rect x="779" y="176" width="92" height="34" rx="17" fill="none" stroke="#f97e72" stroke-width="2"/>
    <text x="825" y="198" text-anchor="middle" fill="#f97e72">/clear</text>
  </g>
</svg>
